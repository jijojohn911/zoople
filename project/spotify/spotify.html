<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="\project\spotify\favicon.png">
    <link rel="stylesheet" href="spotify.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>SPOTIFY CLODE</title>
</head>

<body>
    <div class="container">
        <!-- header-section -->
        <header>
            <nav class="navbar section-content">
                <a href="#" class="logo-container">
                    <img id="logo" src="\project\spotify\logo.jpg" alt="logo image">
                    <span class="logo-text">SPOTIFY</span>
                </a>
                <ul class="nav-menu">
                    <li class="nav-items"><a href="#" class="nav-link"><i class="fa-solid fa-house"></i></a></li>
                    <input type="text" placeholder="What do you want to play?" class="nav-input">
                    <li class="nav-items"><a href="#" class="nav-link">Premium</a></li>
                    <li class="nav-items"><a href="#" class="nav-link">Support</a></li>
                    <li class="nav-items"><a href="#" class="nav-link">Download</a></li>
                    <li class="nav-items"><a href="#" class="nav-link"><i class="fa-regular fa-circle-down"></i>Install
                            app</a></li>
                    <li class="nav-items"><a href="#" class="nav-link">Sign up</a></li>
                    <button>Log In</button>
                </ul>
            </nav>
        </header>
        <main>
            <section class="hero-section">
                <div class="hero-content">
                    <h2 class="library">
                        Your Library
                        </h3>
                        <button class="library-button">
                            <i class="fa-solid fa-plus"></i>
                            <span class="library-button-text">
                                Create
                            </span>
                        </button>
                </div>
                <div class="library-content">
                    <h3 class="library-text">
                        Create your first playlist
                    </h3>
                    <h5 class="description">
                        It's eaasy we'll help you
                    </h5>
                    <button class="create-btn-2">Create playlist</button>
                </div>
                <div class="library-content">
                    <h3 class="library-text">Let's find some podcast to follow</h3>
                    <h5 class="description">We'll keep you updated on new epoisodes</h5>
                    <button class="create-btn-2">Browse podcasts</button>
                </div>
            </section>
            <section class="music-list">
                <div class="trending-songs">
                    <a href="#" class="trending-songs-list">Trending songs</a>
                    <a href="#" class="show-all">Show all</a>
                </div>
            </section>

        </main>




    </div>
</body>

</html>
